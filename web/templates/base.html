<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Sala Kiwi · {% block titulo %}{% endblock %}</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/static/fonts.css?v={{ v }}">
<link rel="stylesheet" href="/static/styles.css?v={{ v }}">
<script src="/static/app.js?v={{ v }}" defer></script>
</head>
<body>
<div class="app" data-theme="dark">
<a class="skip-link" href="#contenido">Saltar al contenido</a>
<header class="site-header">
<div class="container site-header__inner">
<a class="brand" href="/" aria-label="Sala Kiwi, inicio">
<svg class="brand__mark" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 2 30 16 16 30 2 16Z" fill="none" stroke="currentColor" stroke-width="2"></path><path d="M16 9.5 22.5 16 16 22.5 9.5 16Z" fill="currentColor"></path></svg>
<span style="display: flex; flex-direction: column; line-height: 1; gap: 4px">Sala Kiwi<span class="brand__sub">ARAM · personalizadas</span></span>
</a>
<nav class="nav" aria-label="Principal">
<a class="nav__link" href="/"{% if pagina == "inicio" %} aria-current="page"{% endif %}>Inicio</a>
<a class="nav__link" href="/estadisticas"{% if pagina == "estadisticas" %} aria-current="page"{% endif %}>Ranking</a>
<a class="nav__link" href="/equipos"{% if pagina == "equipos" %} aria-current="page"{% endif %}>Equipos</a>
<a class="nav__link" href="/flex"{% if pagina == "flex" %} aria-current="page"{% endif %}>Flex</a>
<button class="theme-toggle" type="button" data-theme-toggle="" aria-label="Cambiar entre tema oscuro y claro">
<svg class="i i--moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"></path></svg>
<svg class="i i--sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"></path></svg>
</button>
</nav>
</div>
</header>

<main id="contenido" class="site-main">
<div class="container">
{% block contenido %}{% endblock %}
</div>
</main>

</div>
</body>
</html>
